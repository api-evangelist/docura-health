aid: docura-health
name: Docura Health
description: >-
  Docura Health builds purpose-built software for physicians who prepare
  medical-legal reports — independent medical examinations (IME), qualified
  medical examiner (QME), agreed medical examiner (AME),
  permanent-and-stationary, and supplemental evaluations. The platform organizes
  complete case files (medical records, audio, and video), generates intelligent
  chronological summaries that link back to source documents, guides AMA
  Guides-compliant impairment ratings (5th and 6th Edition), and produces
  structured reports from customizable templates matched to each evaluator's
  practice style. Docura is HIPAA compliant with enterprise-grade end-to-end
  encryption and audit trails, and is backed by Y Combinator. This profile was
  seeded from a Y Combinator portfolio lead and enriched from Docura Health's
  public website and trust center; no public developer API or documentation was
  found at enrichment time.
